<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
  :root, :root[data-theme="light"] {
    --bg: #f2f0eb;
    --fg: #2b2523;
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --fg: #c9ccd1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #14161a;
      --fg: #c9ccd1;
    }
  }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background 0.2s, color 0.2s;
    user-select: none;
    -webkit-user-select: none;
  }
  #time {
    font-size: clamp(2.5rem, 12vw, 8rem);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
</style>
</head>
<body>
<time id="time"></time>
<script>
(() => {
  "use strict";

  const root = document.documentElement;
  const timeEl = document.getElementById("time");
  const media = matchMedia("(prefers-color-scheme: dark)");

  // 0 = hh:mm, 1 = hh:mm:ss, 2 = hh:mm:ss.xxx
  let format = 1;
  let lastText = "";

  const pad2 = n => String(n).padStart(2, "0");

  function formatTime(d) {
    let s = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    if (format >= 1) s += ":" + pad2(d.getSeconds());
    if (format === 2) s += "." + String(d.getMilliseconds()).padStart(3, "0");
    return s;
  }

  function render() {
    const text = formatTime(new Date());
    if (text !== lastText) {
      lastText = text;
      timeEl.textContent = text;
    }
  }

  function tick() {
    render();
    requestAnimationFrame(tick);
  }

  function effectiveTheme() {
    return root.dataset.theme || (media.matches ? "dark" : "light");
  }

  document.body.addEventListener("click", () => {
    root.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark";
  });

  timeEl.addEventListener("click", e => {
    e.stopPropagation(); // keep the click from also toggling the theme
    format = (format + 1) % 3;
    lastText = "";
    render();
  });

  tick();
})();
</script>
</body>
</html>
