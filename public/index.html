<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<!-- Colours, type and motion come from the Glitchful design system tokens (vendored, no network). -->
<link rel="stylesheet" href="ds-tokens-0.1.2.css">
<style>
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ds-bg);
    color: var(--ds-fg);
    font-family: var(--ds-font-sans);
    -webkit-font-smoothing: antialiased;
    transition: background-color var(--ds-duration-slow) var(--ds-ease-out),
      color var(--ds-duration-slow) var(--ds-ease-out);
    user-select: none;
    -webkit-user-select: none;
  }
  /* A timestamp is a machine value: mono, tabular figures, so digits never shift. */
  #time {
    appearance: none;
    margin: 0;
    padding: 0 var(--ds-space-4);
    border: 0;
    border-radius: var(--ds-radius-2);
    background: none;
    color: inherit;
    font-family: var(--ds-font-mono);
    font-size: clamp(2.5rem, 12vw, 8rem);
    font-weight: var(--ds-weight-regular);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    cursor: pointer;
  }
  /* No box around the time. Keyboard focus shows as accent-coloured digits instead. */
  #time:focus {
    outline: none;
  }
  #time:focus-visible {
    color: var(--ds-accent-fg);
  }
  @media (prefers-reduced-motion: reduce) {
    body {
      transition: none;
    }
  }
</style>
</head>
<body>
<button type="button" id="time" aria-label="Time. Press to change the format."></button>
<script>
(() => {
  "use strict";

  const root = document.documentElement;
  const timeEl = document.getElementById("time");
  const media = matchMedia("(prefers-color-scheme: dark)");

  // 0 = hh:mm, 1 = hh:mm:ss, 2 = hh:mm:ss.xxx
  let format = 1;
  let lastText = "";

  const pad2 = n => String(n).padStart(2, "0");

  function formatTime(d) {
    let s = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    if (format >= 1) s += ":" + pad2(d.getSeconds());
    if (format === 2) s += "." + String(d.getMilliseconds()).padStart(3, "0");
    return s;
  }

  function render() {
    const text = formatTime(new Date());
    if (text !== lastText) {
      lastText = text;
      timeEl.textContent = text;
    }
  }

  function tick() {
    render();
    requestAnimationFrame(tick);
  }

  function effectiveTheme() {
    return root.dataset.theme || (media.matches ? "dark" : "light");
  }

  function toggleTheme() {
    root.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark";
  }

  function cycleFormat() {
    format = (format + 1) % 3;
    lastText = "";
    render();
  }

  document.body.addEventListener("click", toggleTheme);

  // A <button>, so Enter and Space cycle the format too.
  timeEl.addEventListener("click", e => {
    e.stopPropagation(); // keep the click from also toggling the theme
    cycleFormat();
  });

  // Keyboard: t toggles the theme (the click-anywhere gesture has no key otherwise).
  document.addEventListener("keydown", e => {
    if (e.key === "t" && !e.metaKey && !e.ctrlKey && !e.altKey) toggleTheme();
  });

  tick();
})();
</script>
</body>
</html>
