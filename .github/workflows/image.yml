name: image
on: { push: { branches: [main] } }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/glitchful-dev/site-clock:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations would turn the digest home-lab pins into an index digest.
          provenance: false
          sbom: false
      - name: Print the reference to send to home-lab
        env:
          REF: ghcr.io/glitchful-dev/site-clock:${{ github.sha }}@${{ steps.build.outputs.digest }}
        run: echo "$REF" | tee -a "$GITHUB_STEP_SUMMARY"
